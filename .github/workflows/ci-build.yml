name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating Gradle 8.11.1 wrapper..."
            mkdir -p /tmp/gradle-wrapper-init
            printf 'rootProject.name = "init"\n' > /tmp/gradle-wrapper-init/settings.gradle.kts
            gradle -p /tmp/gradle-wrapper-init wrapper --gradle-version 8.11.1
            cp -r /tmp/gradle-wrapper-init/gradlew /tmp/gradle-wrapper-init/gradlew.bat /tmp/gradle-wrapper-init/gradle .
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  build-desktop-linux:
    name: Build Desktop Linux Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            build-essential \
            libv4l-dev \
            libavcodec-dev \
            libavformat-dev \
            libswscale-dev \
            libavutil-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux Client Engine
        run: |
          cmake --build build --config Release --verbose

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-linux-binaries
          path: |
            build/bin/*
            build/lib/*
          if-no-files-found: warn

  build-desktop-windows:
    name: Build Desktop Windows Engine
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure CMake (MSVC x64)
        run: |
          cmake -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows Client Engine & DirectShow Filter
        run: |
          cmake --build build --config Release --verbose

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-windows-binaries
          path: |
            build/bin/Release/*
            build/lib/Release/*
            build/bin/*
            build/lib/*
            scripts/windows/*
          if-no-files-found: warn
