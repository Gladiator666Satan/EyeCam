name: CI Build

permissions:
  contents: write
  pull-requests: write
  statuses: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        run: |
          SDKMANAGER=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating Gradle 8.11.1 wrapper..."
            mkdir -p /tmp/gradle-wrapper-init
            printf 'rootProject.name = "init"\n' > /tmp/gradle-wrapper-init/settings.gradle.kts
            gradle -p /tmp/gradle-wrapper-init wrapper --gradle-version 8.11.1
            cp -r /tmp/gradle-wrapper-init/gradlew /tmp/gradle-wrapper-init/gradlew.bat /tmp/gradle-wrapper-init/gradle .
          fi
          chmod +x gradlew

      - name: Ensure Permanent Debug Keystore
        id: ensure-keystore
        run: |
          mkdir -p keystore ~/.android
          if [ ! -f keystore/debug.keystore ] || ! keytool -list -keystore keystore/debug.keystore -storepass androiddebugkey -alias androiddebugkey > /dev/null 2>&1; then
            echo "Generating consistent permanent debug.keystore..."
            rm -f keystore/debug.keystore
            keytool -genkeypair -v -keystore keystore/debug.keystore -storepass androiddebugkey -alias androiddebugkey -keypass androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "created=true" >> $GITHUB_OUTPUT
          fi
          cp -f keystore/debug.keystore ~/.android/debug.keystore

      - name: Persist Permanent Keystore to Repository
        if: steps.ensure-keystore.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystore/debug.keystore
          git commit -m "chore(ci): persist permanent debug keystore [skip ci]" || true
          git push origin main || true

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1
          GRADLE_EXIT=$?
          set -e
          cat /tmp/gradle-build.log
          if [ $GRADLE_EXIT -ne 0 ]; then
            echo "Gradle failed with exit code $GRADLE_EXIT"
            grep -E "e: |FAILURE:|\* What went wrong:|> Task .* FAILED|Caused by:|Execution failed|Unresolved reference|Duplicate class|Could not resolve|error:" /tmp/gradle-build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::Gradle tail: $(tail -n 20 /tmp/gradle-build.log | tr '\n' ' ' | cut -c1-1500)"
            exit $GRADLE_EXIT
          fi

      - name: Prepare Release Android APK
        run: |
          mkdir -p build/release
          APP_VER=$(grep -E 'versionName[[:space:]]*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          APK_SRC=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -n1)
          if [ -z "$APK_SRC" ]; then
            echo "Built APK not found!" >&2
            exit 1
          fi
          cp -f "$APK_SRC" "build/release/EyeCam-v${APP_VER:-1.3.0}-android.apk"
          ls -lh build/release/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-debug-apk
          path: |
            build/release/*.apk
          if-no-files-found: error

      - name: Report Android Build Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f description="Android APK built successfully!" -f context="EyeCam Android Build" || true
            gh pr comment 1 --body "📱 **Android Build SUCCESS**: Debug APK built successfully with permanent keystore!" || true
          else
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f description="Android Build encountered an error." -f context="EyeCam Android Build" || true
            gh pr comment 1 --body "❌ **Android Build FAILED**: check workflow logs." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-linux:
    name: Build Desktop Linux Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build libv4l-dev v4l2loopback-dkms v4l-utils

      - name: Configure CMake (Linux x64)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="$PWD/build/bin" \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$PWD/build/lib" \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build/lib"

      - name: Build Linux Virtual Camera & Examples
        run: |
          cmake --build build --config Release

      - name: Package Linux Release Archive
        run: |
          mkdir -p build/release build/pkg-linux/bin build/pkg-linux/lib build/pkg-linux/include build/pkg-linux/scripts
          cp -f build/bin/* build/pkg-linux/bin/
          cp -f build/lib/* build/pkg-linux/lib/
          cp -f include/*.hpp build/pkg-linux/include/
          cp -f scripts/linux/setup_v4l2loopback.sh build/pkg-linux/scripts/
          chmod +x build/pkg-linux/bin/* build/pkg-linux/scripts/*.sh
          tar -C build/pkg-linux -czf build/release/EyeCam-Linux-x64.tar.gz .
          ls -lh build/release/

      - name: Upload Linux Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-linux-binaries
          path: |
            build/release/EyeCam-Linux-x64.tar.gz
            build/bin/*
            build/lib/*
          if-no-files-found: error

      - name: Report Linux Build Result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f description="Linux Virtual Camera built successfully!" -f context="EyeCam Linux Build" || true
            gh pr comment 1 --body "🐧 **Linux Build SUCCESS**: V4L2 Virtual Camera module built successfully!" || true
          else
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f description="Linux Build encountered an error." -f context="EyeCam Linux Build" || true
            gh pr comment 1 --body "❌ **Linux Build FAILED**: check workflow logs." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop-windows:
    name: Build Desktop Windows Engine
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Windows PC Icon (.ico)
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/windows/generate_icon.ps1

      - name: Configure CMake (MSVC x64)
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Windows Client Engine, Studio GUI & DirectShow Filter
        run: |
          $buildOut = cmake --build build --config Release --verbose 2>&1
          $exitCode = $LASTEXITCODE
          foreach ($line in $buildOut) {
            Write-Host $line
            if ($line -match "error C\d+|error LNK\d+|fatal error") {
              Write-Host "::error::$line"
            }
          }
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Bundle ADB USB Bridge for Installer
        run: |
          New-Item -ItemType Directory -Path "build\adb" -Force | Out-Null
          $ptDir = "$env:ANDROID_HOME\platform-tools"
          if (-not (Test-Path "$ptDir\adb.exe")) {
            $ptDir = "C:\Android\android-sdk\platform-tools"
          }
          if (Test-Path "$ptDir\adb.exe") {
            Copy-Item "$ptDir\adb.exe" "build\adb\" -Force
            Copy-Item "$ptDir\AdbWinApi.dll" "build\adb\" -Force
            Copy-Item "$ptDir\AdbWinUsbApi.dll" "build\adb\" -Force
          } else {
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "build\pt.zip"
            Expand-Archive -Path "build\pt.zip" -DestinationPath "build\pt_extracted" -Force
            Copy-Item "build\pt_extracted\platform-tools\adb.exe" "build\adb\" -Force
            Copy-Item "build\pt_extracted\platform-tools\AdbWinApi.dll" "build\adb\" -Force
            Copy-Item "build\pt_extracted\platform-tools\AdbWinUsbApi.dll" "build\adb\" -Force
          }

      - name: Build Windows Installer (Inno Setup 6)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          New-Item -ItemType Directory -Path "build\bin\Release" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\installer" -Force | Out-Null
          if (Test-Path "build\Release\EyeCamStudio.exe") {
            Copy-Item "build\Release\*" "build\bin\Release\" -Force
          }
          if (Test-Path "build\bin\EyeCamStudio.exe") {
            Copy-Item "build\bin\*" "build\bin\Release\" -Force
          }
          & $iscc "installer\EyeCamSetup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows Portable Archive
        run: |
          New-Item -ItemType Directory -Path "build\release" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\portable\adb" -Force | Out-Null
          New-Item -ItemType Directory -Path "build\portable\scripts" -Force | Out-Null
          Copy-Item "build\bin\Release\EyeCamStudio.exe" "build\portable\" -Force
          Copy-Item "build\bin\Release\EyeCamFilter.dll" "build\portable\" -Force
          if (Test-Path "build\bin\Release\windows_test.exe") {
            Copy-Item "build\bin\Release\windows_test.exe" "build\portable\" -Force
          }
          Copy-Item "src\windows\gui\eyecam_pc.ico" "build\portable\" -Force
          Copy-Item "build\adb\*" "build\portable\adb\" -Force
          Copy-Item "scripts\windows\*" "build\portable\scripts\" -Force
          Compress-Archive -Path "build\portable\*" -DestinationPath "build\release\EyeCam-Windows-x64-portable.zip" -Force

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-windows-installer
          path: |
            build/installer/EyeCam-Setup-x64.exe
          if-no-files-found: error

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-windows-portable
          path: |
            build/release/EyeCam-Windows-x64-portable.zip
          if-no-files-found: error

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyecam-windows-binaries
          path: |
            build/installer/*
            build/Release/*
            build/bin/Release/*
            build/lib/Release/*
            build/bin/*
            build/lib/*
            scripts/windows/*
          if-no-files-found: warn

      - name: Report Windows Build Result
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f description="Windows Studio GUI, Filter and Installer built successfully!" -f context="EyeCam Windows Build" || true
            gh pr comment 1 --body "🚀 **Windows Build SUCCESS**: EyeCam Studio GUI, DirectShow Filter and EyeCam-Setup-x64.exe installer built successfully!" || true
          else
            gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=failure -f description="Windows Build encountered an error." -f context="EyeCam Windows Build" || true
            gh pr comment 1 --body "❌ **Windows Build FAILED**: check workflow logs." || true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-desktop-linux, build-desktop-windows]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp -f artifacts/eyecam-debug-apk/*.apk release_assets/
          cp -f artifacts/eyecam-windows-installer/EyeCam-Setup-x64.exe release_assets/
          cp -f artifacts/eyecam-windows-portable/EyeCam-Windows-x64-portable.zip release_assets/
          cp -f artifacts/eyecam-linux-binaries/EyeCam-Linux-x64.tar.gz release_assets/
          ls -lh release_assets/
          test "$(ls -1 release_assets | wc -l)" -eq 4

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VER=$(grep -E 'versionName[[:space:]]*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${APP_VER:-1.3.0}"
          APK_FILE=$(basename release_assets/EyeCam-v*-android.apk)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "${{ github.sha }}"
          git push origin "refs/tags/$TAG" --force

          cat << EOF > /tmp/release_notes.md
          ## EyeCam ${TAG}

          Готові інсталятори та бінарні файли для Android, Windows і Linux:

          | Платформа | Файл | Призначення |
          | :--- | :--- | :--- |
          | **Android** | \`${APK_FILE}\` | Мобільний застосунок-камера (Android 8.0+, API 26+, CameraX + OpenGL ES + H.264) |
          | **Windows (Рекомендовано)** | \`EyeCam-Setup-x64.exe\` | Повний інсталятор EyeCam Studio x64 (включно з \`EyeCamFilter.dll\`, вшитим ADB та правилами Firewall) |
          | **Windows (Portable)** | \`EyeCam-Windows-x64-portable.zip\` | Портативний архів з \`EyeCamStudio.exe\`, \`EyeCamFilter.dll\` і вбудованим ADB |
          | **Linux x64** | \`EyeCam-Linux-x64.tar.gz\` | Рушій віртуальної камери \`libEyeCamLinuxSink.a\`, утиліта \`linux_test\`, C++ заголовки та скрипт \`setup_v4l2loopback.sh\` |

          Покрокова інструкція зі встановлення та першого підключення описана в [README.md](https://github.com/${{ github.repository }}#readme).
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --clobber
            gh release edit "$TAG" --title "EyeCam ${TAG}" --notes-file /tmp/release_notes.md --latest
          else
            gh release create "$TAG" release_assets/* --target "${{ github.sha }}" --title "EyeCam ${TAG}" --notes-file /tmp/release_notes.md --latest
          fi
